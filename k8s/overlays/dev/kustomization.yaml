apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/REPLACE_OWNER/civicpulse-backend
    newName: civicpulse-backend
    newTag: dev
  - name: ghcr.io/REPLACE_OWNER/civicpulse-frontend
    newName: civicpulse-frontend
    newTag: dev
patches:
  # Local laptop clusters rarely have room for the full prod replica count —
  # 1 each is enough to prove the manifests are correct without starving
  # the node. Prod overlay leaves the base's replicas: 2 untouched.
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Locally built images have no registry to pull from — don't let the
  # kubelet try.
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
