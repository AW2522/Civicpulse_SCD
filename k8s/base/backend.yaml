# Backend image/app code is Person 1's; this manifest (the K8s deliverable,
# rubric H) is Person 2's. Coordinate before changing container port or env
# var names — the backend should assemble DATABASE_URL itself from
# POSTGRES_HOST/DB/USER (ConfigMap) + POSTGRES_PASSWORD (Secret) rather than
# expecting a single pre-built URL, since K8s can't interpolate strings
# across a ConfigMap and a Secret in one env var.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/REPLACE_OWNER/civicpulse-backend:REPLACE_TAG
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: GROQ_API_KEY
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # Slow start is not failure — this is what stops restart loops on boot.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          # Restarts the pod — must NOT depend on the database.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Removes the pod from the Service — SHOULD depend on the database.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give the Service time to stop sending new traffic before
                # the process starts its own graceful SIGTERM drain.
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
