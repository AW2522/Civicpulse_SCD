# A Deployment for a database loses marks here on purpose (assignment §3.3):
# a Deployment has no stable identity or per-replica storage, so a rescheduled
# pod can attach to the wrong volume. StatefulSet + volumeClaimTemplates gives
# postgres a stable name and its own PVC that survives pod deletion.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: civicpulse
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: civicpulse-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: civicpulse-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse", "-d", "civicpulse"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse", "-d", "civicpulse"]
            periodSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: civicpulse
spec:
  clusterIP: None   # headless — StatefulSet pods get stable DNS (postgres-0.postgres...)
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
