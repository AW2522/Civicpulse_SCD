# CivicPulse frontend — nginx serves the built SPA and proxies /api to the
# backend container. This is the runtime-configuration answer (ADR 0002):
# the frontend image never bakes in a backend origin, so the same image
# runs unchanged in dev, CI and prod — only BACKEND_HOST/BACKEND_PORT
# (or the compose/K8s service name) differs.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: hashed filenames from the Vite build, safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: any non-file route resolves to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the backend container. In Compose the DNS name is the
    # service name (backend); in Kubernetes it's the Service name — either
    # way this file does not change, only BACKEND_UPSTREAM (templated at
    # image build time via envsubst is deliberately avoided; see the ADR for
    # why a static, network-level default is preferred here).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
