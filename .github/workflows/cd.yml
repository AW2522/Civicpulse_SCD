name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.backend-build.outputs.digest }}
      frontend-digest: ${{ steps.frontend-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:latest
      - name: Build + push frontend
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:latest

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
          artifact-name: backend-sbom.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: frontend-sbom.spdx.json

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kind (not k3d): the ingress-nginx "kind" provider manifest below needs a node
      # labelled ingress-ready=true and host port 80 mapped — see .github/kind-config.yaml.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: civicpulse-ci
          config: .github/kind-config.yaml
      - name: Install nginx ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=120s
      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: Point overlays/prod at the images just built
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            "ghcr.io/REPLACE_OWNER/civicpulse-backend=ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}" \
            "ghcr.io/REPLACE_OWNER/civicpulse-frontend=ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}"
      - name: Create the image-pull and app secrets
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic civicpulse-secrets \
            --namespace civicpulse \
            --from-literal="POSTGRES_PASSWORD=${{ secrets.CI_POSTGRES_PASSWORD }}" \
            --from-literal="GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy
        run: |
          kustomize build k8s/overlays/prod | kubectl apply -f -
          kubectl -n civicpulse rollout status deployment/backend --timeout=180s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s
      - name: Smoke test through the Ingress
        run: |
          # kind maps the node's port 80 to the runner's localhost:80 (.github/kind-config.yaml).
          # /api/stats is a real backend route (it touches Postgres and Redis), so a 200 here
          # proves ingress -> backend -> data layer, not just that a pod is alive.
          # (/health has no /api prefix, so it is NOT reachable through this Ingress.)
          for _ in $(seq 1 30); do
            if curl -fs -H "Host: civicpulse.local" http://localhost/api/stats; then
              echo; curl -fs -o /dev/null -H "Host: civicpulse.local" http://localhost/ && echo "frontend OK"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed"; kubectl -n civicpulse get pods; kubectl -n civicpulse logs deployment/backend --tail=50; exit 1
      - name: Print HPA state
        if: always()
        run: kubectl get hpa -n civicpulse

  release-notes:
    needs: deploy-k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record what's deployed
        run: |
          {
            echo "Deployed commit: ${{ github.sha }}"
            echo "Backend image:  ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}"
            echo "Frontend image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
